<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&amp;D — русская база</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--cf:240px;--cl:340px;--bg:#e9e1d0;--paper:#fdf1dc;--ink:#1d1a16;--red:#7a200d;--bar:#922610;--line:#d9c7a3;--muted:#6b5f4d;--panel:#f5ecd9}
@media(prefers-color-scheme:dark){:root{--bg:#1b1713;--panel:#2a241d;--line:#4a3f31;--muted:#b8a98f}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:16px/1.45 'PT Serif',Georgia,serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"nav" "main"}
@media(prefers-color-scheme:dark){.col,nav{color:#eadfc9}}
nav{grid-area:nav;display:flex;gap:2px;overflow-x:auto;background:var(--bar);padding:0 8px}
nav a{color:#f6e3c8;text-decoration:none;padding:10px 12px;font:700 15px 'PT Sans',sans-serif;white-space:nowrap}
nav a[aria-current=true]{background:var(--paper);color:var(--red)}
.col{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}main{min-width:0}
.col header{padding:12px 12px 6px}.qr{display:flex;gap:6px}
input,select{width:100%;font:15px 'PT Sans',sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fffaf0;color:#1d1a16}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font:700 15px 'PT Sans',sans-serif}
.fh button,#ftoggle,#fdone{font:13px 'PT Sans',sans-serif;border:1px solid var(--line);background:transparent;color:inherit;border-radius:4px;padding:4px 9px;cursor:pointer;white-space:nowrap}.fh button:hover{border-color:var(--bar);color:var(--bar)}
#ftoggle,#fdone{display:none}
.cb{font:700 15px 'PT Sans',sans-serif;border:1px solid var(--line);background:transparent;color:inherit;border-radius:4px;padding:2px 9px;cursor:pointer}.cb:hover{border-color:var(--bar);color:var(--bar)}
.strip{display:none;flex:1;border:0;background:transparent;color:inherit;font:700 14px 'PT Sans',sans-serif;cursor:pointer;writing-mode:vertical-rl;padding:14px 0;text-align:left;white-space:nowrap}.strip:hover{color:var(--bar)}
@media(min-width:781px){body.nof{--cf:38px}body.nol{--cl:38px}
body.nof #fcol>:not(.strip),body.nol #lcol>:not(.strip){display:none}body.nof #fcol .strip,body.nol #lcol .strip{display:block}
#fcol,#lcol{grid-area:main;z-index:3;justify-self:start;box-shadow:3px 0 12px rgba(0,0,0,.25)}#fcol{width:var(--cf)}#lcol{width:var(--cl);margin-left:var(--cf)}}
.sr{margin-top:6px}.sr select{flex:1;min-width:0}#dir{width:40px;flex:none;font:700 16px 'PT Sans',sans-serif;border:1px solid var(--line);background:transparent;color:inherit;border-radius:4px;cursor:pointer}#dir:hover{border-color:var(--bar);color:var(--bar)}
#fl{flex:1;overflow:auto;padding-bottom:20px;font:14px 'PT Sans',sans-serif}
.g{padding:8px 12px;border-bottom:1px solid var(--line)}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.gn{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--bar);color:#fff;font-size:12px;text-align:center}.gn:empty{display:none}
.go{max-height:230px;overflow:auto}
.o,.md{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer}.md{font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);margin-bottom:3px;padding-bottom:4px}
.o input,.md input{width:auto;margin:0;padding:0;flex:none}.o span{flex:1}.o em{font-style:normal;font-size:12px;opacity:.6}.o.z{opacity:.4}
#count{font:13px 'PT Sans',sans-serif;color:var(--muted);padding:0 12px 6px}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#list a{display:block;padding:7px 12px;color:inherit;text-decoration:none;border-top:1px solid var(--line);font-family:'PT Sans',sans-serif}
#list a:hover{background:rgba(146,38,16,.1)}#list a[aria-current=true]{background:var(--bar);color:#fff}
#list .t{display:flex;justify-content:space-between;gap:8px}#list small{opacity:.7;white-space:nowrap;font-size:12px;padding-top:3px}#list .s{display:block;font-size:12.5px;line-height:1.35;opacity:.75;margin-top:2px}
main{grid-area:main;overflow:auto;padding:26px 18px 60px}.wrap{max-width:780px;margin:0 auto}
.stat{background:var(--paper);padding:16px 20px 18px;border:1px solid #c9b48a;border-top:4px solid var(--bar);border-bottom:4px solid var(--bar);box-shadow:0 3px 14px rgba(40,25,5,.35);color:#1d1a16;font-size:15px;line-height:1.4}
.stat h2{font:700 27px/1.1 'PT Serif',serif;color:var(--red);margin:0;font-variant:small-caps}
.en{font:italic 13px 'PT Sans',sans-serif;color:#7b6a52;margin:2px 0 0}.sub{font-style:italic;margin:4px 0 0}
.rule{height:5px;margin:8px 0;background:var(--bar);clip-path:polygon(0 50%,100% 0,100% 100%)}
.stat p{margin:0 0 5px}.pr b{color:var(--red)}
.stat h3{font:400 21px/1.2 'PT Serif',serif;color:var(--red);border-bottom:1px solid var(--red);margin:14px 0 6px;font-variant:small-caps}
.stat h4{font:700 16px 'PT Serif',serif;color:var(--red);margin:10px 0 3px}
.stat ul{margin:0 0 6px;padding-left:20px}.stat blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--bar);font-style:italic}
.sc{overflow-x:auto;margin:6px 0 10px}
.tb{border-collapse:collapse;font:14px 'PT Sans',sans-serif;width:100%}
.tb td,.tb th{padding:3px 7px;text-align:left;vertical-align:top}.tb tr:nth-child(odd) td{background:#f0dfbf}.tb th{color:var(--red);border-bottom:2px solid var(--bar)}.tb tr.h td{font-weight:700;color:var(--red)}
.abil{display:flex;gap:10px;flex-wrap:wrap}.abil table{flex:1 1 230px;border-collapse:collapse;font:14px 'PT Sans',sans-serif}
.abil th{color:var(--red);font-size:12px}.abil td{text-align:center;padding:1px 4px}.abil td:first-child{text-align:left;font-weight:700;color:var(--red)}
.it .nm{font-weight:700;font-style:italic}.ind{margin-left:1.2em}.intro{font-style:italic}
.stat a{color:var(--red)}.stat details{margin:6px 0;border-top:1px solid var(--line);padding-top:4px}.stat summary{cursor:pointer;font:700 17px 'PT Serif',serif;color:var(--red)}
.meta{margin-top:12px;font:13px/1.5 'PT Sans',sans-serif;color:var(--muted)}.meta a{color:var(--bar)}
.empty{text-align:center;margin-top:18vh;color:var(--muted);font-family:'PT Sans',sans-serif}
#back{display:none}
@media(max-width:780px){body{display:block;height:auto}nav{position:sticky;top:0;z-index:2}.col{height:calc(100vh - 42px);border:0}#fcol{display:none}body.fshow #fcol{display:flex}body.fshow #lcol{display:none}main{display:none;padding:10px 6px 40px}
body.open .col{display:none}body.open main{display:block}#ftoggle,#fdone{display:inline-block}
#fcol .strip,#lcol .strip,.cb{display:none!important}
#back{display:inline-block;margin:0 0 10px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:4px;font:14px 'PT Sans',sans-serif;cursor:pointer}}
.ed{display:flex;align-items:center;margin:0 8px 0 0;padding:6px 0;flex:none}
nav .ed a{padding:4px 11px;border:1px solid rgba(246,227,200,.5);font:700 13px 'PT Sans',sans-serif}
nav .ed a:first-child{border-radius:4px 0 0 4px}nav .ed a:last-child{border-radius:0 4px 4px 0;border-left:0}
body.e14{--red:#1f5560;--bar:#2b6a75;--line:#bcd0c9}
@media(prefers-color-scheme:dark){body.e14{--line:#3d4f4b;--bg:#141b1b;--panel:#1f2a29}}
body.e14 .tb tr:nth-child(odd) td{background:#dfeae4}
</style></head>
<body>
<nav id="nav"></nav>
<aside class="col" id="fcol"><div class="fh"><span>Фильтры <span class="gn" id="fn"></span></span><span><button id="reset" type="button">Сбросить</button> <button id="fdone" type="button">Готово</button> <button class="cb" data-col="f" type="button" title="Свернуть фильтры">«</button></span></div><button class="strip" data-col="f" type="button" title="Развернуть фильтры">» Фильтры</button><div id="fl"></div></aside>
<section class="col" id="lcol"><header><div class="qr"><input id="q" type="search" placeholder="Поиск (рус / eng)" autocomplete="off"><button id="ftoggle" type="button">Фильтры</button><button class="cb" data-col="l" type="button" title="Свернуть список">«</button></div><div class="qr sr"><select id="sort" aria-label="Сортировка"></select><button id="dir" type="button" title="Направление сортировки">↑</button></div></header><div id="count"></div><ul id="list"></ul><button class="strip" data-col="l" type="button" title="Развернуть список">» Список</button></section>
<main><div class="wrap"><button id="back" type="button">← К списку</button><div id="card"><p class="empty">Выберите запись в списке</p></div></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');
const sg=n=>(n<0?'\u2212':'+')+Math.abs(n),pr=(l,v)=>v?`<p class="pr"><b>${l}</b> ${fmt(v)}</p>`:'';
const T=(rows,h)=>`<div class="sc"><table class="tb">${rows.map((r,i)=>`<tr${h&&!i?' class="h"':''}>${r.map(c=>`<td>${fmt(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const B=bl=>(bl||[]).map(b=>b.type=='heading'||b.type=='subheader'?`<h4>${fmt(b.text)}</h4>`:b.type=='list'?`<ul>${b.items.map(i=>`<li>${fmt(i)}</li>`).join('')}</ul>`:b.type=='table'?T(b.rows,b.header):b.type=='quote'?`<blockquote>${fmt(b.text)}</blockquote>`:`<p>${fmt(b.text)}</p>`).join('');
const head=(m,sub)=>`<h2>${esc(m.name_ru)}</h2>${m.name_en?`<p class="en">${esc(m.name_en)}</p>`:''}${sub?`<p class="sub">${esc(sub)}</p>`:''}<div class="rule"></div>`;
const foot=m=>`</article><p class="meta">${m.sources?.length?'Источники: '+esc(m.sources.join(', '))+'. ':''}<a href="${esc(m.url)}" target="_blank" rel="noopener"></a><span id="xref"></span></p>`;
const props=m=>(m.props||[]).map(p=>pr(esc(p.label),p.value)).join('');
const num=(a,b)=>parseFloat(a)-parseFloat(b),CR=['0','1/8','1/4','1/2',...Array.from({length:30},(_,i)=>''+(i+1))];
const lvl=m=>m.level?m.level+' уровень':'Заговор',rar=m=>(m.rarity||'—');
const ABIL=[['str','СИЛ'],['dex','ЛОВ'],['con','ТЕЛ'],['int','ИНТ'],['wis','МДР'],['cha','ХАР']];
const at=(k,m)=>`<table><tr><th></th><th></th><th>мод</th><th>спас</th></tr>${k.map(([a,r])=>{const x=m.abilities[a];return`<tr><td>${r}</td><td>${x.score}</td><td>${sg(x.mod)}</td><td>${sg(x.save)}</td></tr>`}).join('')}</table>`;
const ent=e=>`<p class="it${e.indent||e.n?' ind':''}">${e.n?`<b>${e.n}.</b> `:''}${e.name?`<span class="nm">${esc(e.name)}.</span> `:''}${fmt(e.text)}${(e.rows||[]).map(r=>`<br><i>${esc(r.label)}:</i> `+r.spells.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener"><i>${esc(s.name)}</i></a>`).join(', ')).join('')}</p>`;
const loreBl=l=>(Array.isArray(l)?l:(l&&l.blocks)||[]).map(b=>b.type=='table'&&b.header===undefined?{...b,header:true}:b),
 lore=l=>l&&loreBl(l).length?`<details open><summary>${esc((!Array.isArray(l)&&l.title)||'Описание')}</summary>${!Array.isArray(l)&&l.subtitle?`<p class="sub">${esc(l.subtitle)}</p>`:''}${B(loreBl(l))}</details>`:'',
 loreView=l=>l&&loreBl(l).length?`<div class="rule"></div><div class="lore"><h3>${esc((!Array.isArray(l)&&l.title)||'Описание')}</h3>${!Array.isArray(l)&&l.subtitle?`<p class="sub">${esc(l.subtitle)}</p>`:''}${B(loreBl(l))}</div>`:'';
const S={
bestiary:{t:'Бестиарий',sub:m=>'БО '+m.cr,
 card:m=>{const sl=(m.swarm?`${m.size_text} рой ${m.swarm_of}`:`${m.size_text} ${m.type}`)+(m.tags.length?` (${m.tags.join(', ')})`:'')+`, ${m.alignment_text}`+(m.named_npc?', именной НИП':'');
 return `<article class="stat">${head(m,sl)}<p class="pr"><b>Класс Защиты</b> ${m.ac} &nbsp; <b>Инициатива</b> ${sg(m.initiative.mod)} (${m.initiative.score})</p><p class="pr"><b>Хиты</b> ${m.hp.avg}${m.hp.formula?` (${esc(m.hp.formula)})`:''}</p>${pr('Скорость',m.speed_text)}<div class="rule"></div><div class="abil">${at(ABIL.slice(0,3),m)}${at(ABIL.slice(3),m)}</div><div class="rule"></div>`
 +pr('Навыки',(m.skills||[]).map(s=>`${s.name} ${sg(s.bonus)}`).join(', '))+pr('Уязвимость к урону',m.vulnerabilities)+pr('Сопротивление урону',m.resistances)+pr('Иммунитеты',m.immunities)+pr('Чувства',m.senses)+pr('Языки',m.languages)+`<p class="pr"><b>Опасность</b> ${esc(m.cr)} (${esc(m.xp_text)})</p>`
 +m.sections.map(s=>`<h3>${esc(s.title||'')}</h3>${s.intro?`<p class="intro">${fmt(s.intro)}</p>`:''}${s.items.map(ent).join('')}`).join('')+`<div class="rule"></div>`+pr('Бонус мастерства',sg(m.pb))+pr('Среда обитания',m.habitat)+pr('Сокровища',m.treasure)+loreView(m.lore)+foot(m)}},
spells:{t:'Заклинания',sub:m=>m.level?m.level+' ур.':'загов.',
 card:m=>`<article class="stat">${head(m,m.line)}${pr('Время сотворения',m.cast_time)}${pr('Дистанция',m.range)}${pr('Компоненты',m.components)}${pr('Длительность',m.duration)}${pr('Классы',(m.classes||[]).map(c=>c.name).join(', '))}${pr('Подклассы',m.subclasses)}<div class="rule"></div>${B(m.blocks)}${m.higher?`<p>${fmt(m.higher)}</p>`:''}${m.circle?`<p>${fmt(m.circle)}</p>`:''}${foot(m)}`},
items:{t:'Предметы',sub:rar,
 card:m=>`<article class="stat">${head(m,m.line)}${pr('Рекомендованная стоимость',m.price)}${props(m)}<div class="rule"></div>${B(m.blocks)}${foot(m)}`},
equipment:{t:'Снаряжение',sub:m=>m.cost||'',
 card:m=>`<article class="stat">${head(m,m.line)}${props(m)}${m.blocks?.length?`<div class="rule"></div>${B(m.blocks)}`:''}${foot(m)}`},
feats:{t:'Черты',sub:m=>(m.category||'').replace(' черта','').replace('Черта ',''),
 card:m=>`<article class="stat">${head(m,m.line)}${B(m.blocks)}${foot(m)}`},
backgrounds:{t:'Предыстории',sub:()=>'',
 card:m=>{const f=m.feat,fs=f&&f.url?f.url.replace(/\/$/,'').split('/').pop().replace(/^\d+-/,''):null;
 return `<article class="stat">${head(m,'')}${pr('Характеристики',(m.abilities||[]).join(', '))}${f?`<p class="pr"><b>Черта</b> ${fs?`<a href="#feats/${esc(fs)}">${esc(f.name)}</a>`:esc(f.name)}</p>`:''}${pr('Навыки',(m.skills||[]).join(', '))}${pr('Инструменты',m.tools)}${pr('Снаряжение',m.equipment)}<div class="rule"></div>${B(m.blocks)}${foot(m)}`}},
species:{t:'Виды',sub:()=>'',card:m=>`<article class="stat">${head(m,'')}${props(m)}<div class="rule"></div>${B(m.blocks)}${foot(m)}`},
class:{t:'Классы',sub:()=>'',card:m=>{const tb=m.table;
 return `<article class="stat">${head(m,'')}${(m.core_traits||[]).map(c=>pr(esc(c.label),c.value)).join('')}${tb?`<div class="sc"><table class="tb"><tr>${tb.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${tb.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:''}`
 +(m.becoming?m.becoming.parts.map(p=>`<details><summary>${esc(p.title)}</summary>${B(p.blocks)}</details>`).join(''):'')
 +(m.features||[]).map(f=>`<h3>Уровень ${f.level}: ${esc(f.name)}</h3>${B(f.blocks)}`).join('')+`<h3>Подклассы</h3>`
 +(m.subclasses||[]).map(s=>`<details><summary>${esc(s.name)}</summary>${B(s.description)}${s.features.map(f=>`<h4>Уровень ${f.level}: ${esc(f.name)}</h4>${B(f.blocks)}`).join('')}</details>`).join('')+loreView(m.lore)+foot(m)}},
glossary:{t:'Глоссарий',sub:()=>'',card:m=>`<article class="stat">${head(m,m.group||'')}${B(m.blocks)}${foot(m)}`}
};
/* ---- фильтры ---- */
/* ===== фильтры: [название, значения(m)=>[...], сортировка?, multi?] ===== */
const ru=(a,b)=>String(a).localeCompare(b,'ru'),
 ord=l=>(a,b)=>{const x=l.indexOf(a),y=l.indexOf(b);return(x<0?999:x)-(y<0?999:y)||ru(a,b)},
 yn=v=>[v?'Да':'Нет'],
 tx=m=>(m.blocks||[]).map(b=>b.text||(b.items||[]).join(' ')||(b.rows||[]).flat().join(' ')).join(' '),
 rx=(m,list)=>{const t=tx(m);return list.filter(([,r])=>r.test(t)).map(([n])=>n)},
 SRC=m=>[...new Set((m.sources||[]).map(s=>/^Также/.test(s)?'SRD 5.2.1':s))],
 bucket=(n,b)=>{if(n==null||isNaN(n))return null;for(const[l,max]of b)if(n<=max)return l;return b.at(-1)[0]},
 GP=[['до 1 зм',1],['1–10 зм',10],['10–100 зм',100],['более 100 зм',1/0]],
 GPL=GP.map(x=>x[0]),
 PRICE=n=>n==null?'Без цены':bucket(n,[['до 100 зм',100],['100–1 000 зм',1000],['1 000–10 000 зм',1e4],['более 10 000 зм',1/0]]),
 PRICEL=['до 100 зм','100–1 000 зм','1 000–10 000 зм','более 10 000 зм','Без цены'],
 SIZES=['Крошечный','Маленький','Средний','Большой','Огромный','Громадный'],
 DMGT=['Дробящий','Колющий','Рубящий','Кислота','Огонь','Холод','Электричество','Звук','Яд','Излучение','Некротический','Психический','Силовое поле'],
 CONDS=['Бессознательный','Истощение','Испуганный','Окаменевший','Опрокинутый','Опутанный','Оглохший','Ослеплённый','Отравленный','Очарованный','Парализованный','Схваченный','Недееспособный','Ошеломлённый'],
 items_=s=>(s||'').split(/[;,]/).map(t=>t.replace(/\(.*?\)/g,'').trim().replace(/^Силовой$/,'Силовое поле')).filter(Boolean),
 dmg=s=>items_(s).filter(t=>DMGT.includes(t)),cnd=s=>items_(s).filter(t=>CONDS.includes(t)),
 ALIGN={LG:'Принципиальный добрый',NG:'Нейтральный добрый',CG:'Хаотичный добрый',LN:'Принципиальный нейтральный',N:'Нейтральный',CN:'Хаотичный нейтральный',LE:'Принципиальный злой',NE:'Нейтральный злой',CE:'Хаотичный злой',U:'Без мировоззрения'},
 ABIL_RU=['Сила','Ловкость','Телосложение','Интеллект','Мудрость','Харизма'],
 abil=s=>ABIL_RU.filter(a=>new RegExp(a.slice(0,-1)).test(s||'')),
 /* заклинания */
 castT=m=>{const b=(m.cast_time||'').split(/,| или /)[0].replace(/\s*\(.*\)/,'').trim();return /^Бонус/i.test(b)?'Бонусное действие':/^Реакц/i.test(b)?'Реакция':b},
 SEC={'раунд':6,'мин':60,'час':3600,'ч':3600,'дн':86400,'день':86400},
 durT=m=>{const s=m.duration||'';if(/мгнов/i.test(s))return'Мгновенная';if(/пока не рассеяно/i.test(s))return'Пока не рассеяно';
